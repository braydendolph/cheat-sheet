name: Build & release

# Push a tag like v1.0.0 to build CheatSheet.exe + the installer and publish
# them on a GitHub Release. "Run workflow" builds them as downloadable artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller

      - name: Work out version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build CheatSheet.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name CheatSheet
          --icon assets\icon.ico --add-data "assets;assets" --add-data "games;games" main.py

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\CheatSheet.iss

      - uses: actions/upload-artifact@v4
        with:
          name: CheatSheet-${{ steps.ver.outputs.version }}
          path: |
            dist/CheatSheet.exe
            dist/CheatSheet-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/CheatSheet.exe
            dist/CheatSheet-Setup-*.exe
